<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; font-family: var(--el-font-sans); background: var(--el-surface); color: var(--el-on-dark); }
  .wrap { padding: 22px 24px; display:flex; flex-direction:column; gap: 14px; }
  .spec { display:flex; align-items:baseline; gap:14px; }
  .meta { font-family: var(--el-font-mono); font-size:11px; color: rgba(255,255,255,.5); width:118px; flex:none; }
  .eyebrow { text-transform:uppercase; letter-spacing:.2em; font-size:12px; color: var(--el-muted); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="spec"><span class="meta">24 / 600</span><span style="font-size:24px;font-weight:600;letter-spacing:.025em">Traffic Monitor</span></div>
    <div class="spec"><span class="meta">18 / 600</span><span style="font-size:18px;font-weight:600">Recent Calls</span></div>
    <div class="spec"><span class="meta">20 / 800</span><span style="font-size:20px;font-weight:800">97.4%</span></div>
    <div class="spec"><span class="meta">14 / 400</span><span style="font-size:14px">Snapshot from the hub with live updates over SSE.</span></div>
    <div class="spec"><span class="meta">12 / 700</span><span class="eyebrow">Phoenix Fire</span></div>
  </div>
</body>
</html>
