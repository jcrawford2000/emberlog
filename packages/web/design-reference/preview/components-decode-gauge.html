<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; font-family: var(--el-font-sans); background: var(--el-surface); color:#fff; }
  .wrap { padding: 22px; display:flex; gap: 28px; align-items:center; justify-content:center; }
  .gauge { position:relative; width:150px; height:150px; border-radius:9999px; border:1px solid var(--el-line-15); padding:0; }
  .gauge.sel { border-color: var(--el-engine); box-shadow: var(--el-ring-engine); }
  .ring { width:100%; height:100%; border-radius:9999px; display:grid; place-items:center; }
  .well { width:82%; height:82%; border-radius:9999px; border:1px solid var(--el-line-20); background: var(--el-slate-950); display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:0 10px; }
  .sys { font-size:16px; font-weight:800; }
  .rate { font-size:15px; font-weight:600; color: var(--el-slate-300); margin-top:3px; display:inline-flex; align-items:center; gap:4px; }
  .live { margin-top:8px; display:inline-flex; align-items:center; gap:5px; border:1px solid var(--el-line-15); background: var(--el-fill-05); border-radius:9999px; padding:3px 9px; font-size:11px; font-weight:600; }
  [data-lucide] { width:13px; height:13px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="gauge sel">
      <div class="ring" style="background:conic-gradient(#10b981 350deg, rgba(255,255,255,.16) 0deg)">
        <div class="well"><div class="sys">RWC</div><div class="rate">97.4% <i data-lucide="info"></i></div><div class="live"><i data-lucide="radio"></i>4 Live</div></div>
      </div>
    </div>
    <div class="gauge">
      <div class="ring" style="background:conic-gradient(#f59e0b 256deg, rgba(255,255,255,.16) 0deg)">
        <div class="well"><div class="sys">PSPRS</div><div class="rate">71.2% <i data-lucide="info"></i></div><div class="live"><i data-lucide="radio"></i>1 Live</div></div>
      </div>
    </div>
  </div>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>lucide.createIcons();</script>
</body>
</html>
