<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; font-family: var(--el-font-sans); background: var(--el-surface); }
  .wrap { padding: 24px; display:grid; grid-template-columns: 1fr 1fr; gap:16px; }
  .card { background:#FAFAFA; color:#1C1C1C; border:1px solid #444; border-radius:1rem; box-shadow: var(--el-shadow-card); padding:16px; text-align:left; }
  .card.sel { box-shadow: var(--el-shadow-card), 0 0 0 2px var(--el-safety); }
  .top { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
  .eyebrow { font-size:11px; text-transform:uppercase; letter-spacing:.2em; color:#7A7A7A; }
  .title { font-size:18px; font-weight:600; margin-top:2px; }
  .pill { display:inline-flex; align-items:center; border-radius:9999px; padding:2px 10px; font-size:12px; font-weight:500; background:#B0B0B0; color:#1C1C1C; border:1px solid #444; }
  .bottom { margin-top:16px; display:flex; align-items:flex-end; justify-content:space-between; }
  .big { font-size:30px; font-weight:700; color: var(--el-engine); line-height:1; }
  .lbl { font-size:11px; color:#7A7A7A; margin-top:4px; }
  .r { text-align:right; color:#7A7A7A; font-size:13px; }
  .r b { display:block; font-size:18px; color:#1C1C1C; font-weight:600; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="card sel">
      <div class="top"><div><div class="eyebrow">Phoenix Fire</div><div class="title">RWC Regional</div></div><span class="pill">ok</span></div>
      <div class="bottom"><div><div class="big">97.4%</div><div class="lbl">decode rate</div></div><div class="r"><b>4</b>active calls<div>2 sites</div></div></div>
    </div>
    <div class="card">
      <div class="top"><div><div class="eyebrow">Maricopa</div><div class="title">PSPRS West</div></div><span class="pill">warn</span></div>
      <div class="bottom"><div><div class="big">71.2%</div><div class="lbl">decode rate</div></div><div class="r"><b>1</b>active calls<div>1 site</div></div></div>
    </div>
  </div>
</body>
</html>
