<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; font-family: var(--el-font-sans); background: var(--el-surface); color: var(--el-on-dark); }
  .wrap { padding: 22px 24px; }
  .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .sw { border-radius: 11px; overflow: hidden; border: 1px solid var(--el-line-15); }
  .chip { height: 70px; }
  .lbl { padding: 8px 10px 10px; background: rgba(0,0,0,0.28); }
  .name { font-size: 12.5px; font-weight: 700; }
  .hex { font-family: var(--el-font-mono); font-size: 11px; color: rgba(255,255,255,.62); margin-top: 2px; }
  .use { font-size: 11px; color: rgba(255,255,255,.52); margin-top: 2px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="row">
      <div class="sw"><div class="chip" style="background:#10B981"></div><div class="lbl"><div class="name">ok</div><div class="hex">#10B981</div><div class="use">emerald · healthy</div></div></div>
      <div class="sw"><div class="chip" style="background:#F59E0B"></div><div class="lbl"><div class="name">warn</div><div class="hex">#F59E0B</div><div class="use">amber · warning</div></div></div>
      <div class="sw"><div class="chip" style="background:#F43F5E"></div><div class="lbl"><div class="name">bad</div><div class="hex">#F43F5E</div><div class="use">rose · fault</div></div></div>
      <div class="sw"><div class="chip" style="background:#94A3B8"></div><div class="lbl"><div class="name">idle</div><div class="hex">#94A3B8</div><div class="use">slate · unknown</div></div></div>
    </div>
  </div>
</body>
</html>
